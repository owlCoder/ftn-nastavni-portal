name: ERS AI example

on:
  pull_request:
    paths:
      - 'examples/ers-ai-workflow/**'
      - 'src/courses/ers/practicum/**'
      - '.github/workflows/ers-ai-example.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/ers-ai-workflow/**'
      - 'src/courses/ers/practicum/**'
      - '.github/workflows/ers-ai-example.yml'

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ers-ai-workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore solution
        run: dotnet restore EquipmentReservation.sln
      - name: Build solution
        run: dotnet build EquipmentReservation.sln --configuration Release --no-restore
      - name: Run tests
        run: dotnet test EquipmentReservation.sln --configuration Release --no-build --verbosity minimal
