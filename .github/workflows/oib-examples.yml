name: OIB examples

on:
  pull_request:
    paths:
      - 'examples/oib-dotnet/**'
      - '.github/workflows/oib-examples.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/oib-dotnet/**'
      - '.github/workflows/oib-examples.yml'

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/oib-dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test every exercise
        run: sh verify.sh
